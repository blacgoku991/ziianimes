services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ziia
      POSTGRES_PASSWORD: ziia
      POSTGRES_DB: ziia
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziia"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ziia:ziia@db:5432/ziia
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_LOCAL_ROOT: /data/storage
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - storage:/data/storage
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Worker d'imagerie : gourmand en CPU et en mémoire, séparé de l'API pour
  # qu'un rendu lourd ne dégrade pas les temps de réponse.
  worker-imaging:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ziia:ziia@db:5432/ziia
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_LOCAL_ROOT: /data/storage
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - storage:/data/storage
    command: celery -A app.workers.celery_app.celery_app worker -Q imaging -c 2 --loglevel=info

  # Étape 4 : les workers Playwright viendront ici, dans leur propre image et
  # avec leur propre file. Ils ne partagent ni le processus, ni le conteneur
  # de l'API — un navigateur qui tombe ne doit pas emporter le backend.

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  storage:
